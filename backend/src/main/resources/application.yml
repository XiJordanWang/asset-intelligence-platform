spring:
  application:
    name: asset-intelligence
  # Zero setup by default: an embedded H2 database stored in backend/data/ (PostgreSQL compatibility mode).
  # Set DB_URL, DB_USER and DB_PASSWORD to use PostgreSQL instead (Docker Compose does this).
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/assetintel;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  # Hosting platforms such as Render pass the port to listen on in PORT.
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

assetintel:
  demo:
    # Seed the database with a fictional NZ company on startup when it is empty.
    seed-on-startup: ${DEMO_SEED:true}
    random-seed: 2026
    asset-count: 2500
    request-count: 60
